<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Trial</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 320px;
        }

        #display {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 20px;
            background: #edf2f7;
            padding: 12px 16px;
            border-radius: 8px;
            text-align: center;
            width: 100%;
            word-break: break-word;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px 14px;
            font-size: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
        }

        input[type="number"]:focus {
            border-color: #667eea;
        }

        #operator {
            font-size: 1.4rem;
            font-weight: bold;
            color: #667eea;
            margin: 8px 0;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            width: 100%;
            justify-content: center;
        }

        button {
            flex: 1;
            padding: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background-color: #edf2f7;
            color: #2d3748;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        #equal {
            width: 100%;
            margin-top: 12px;
            background-color: #48bb78;
            color: white;
        }

        #equal:hover {
            background-color: #38a169;
        }
    </style>
</head>

<body>
    <div class="calculator-card">
        <h1 id="display">Result will appear here!</h1>
        <input type="number" id="first" placeholder="First number">
        <p id="operator">__</p>
        <input type="number" id="second" placeholder="Second number">

        <div class="button-group">
            <button class="operation" onclick="selectOperator('+')">+</button>
            <button onclick="selectOperator('-')">-</button>
            <button onclick="selectOperator('*')">*</button>
            <button onclick="selectOperator('/')">/</button>
        </div>

        <button id="equal" onclick="calculate()">=</button>
    </div>

    <script>
        let currentOperator = "";

        const selectOperator = (op) => {
            currentOperator = op;
            document.getElementById("operator").innerText = op;
        };

        const calculate = () => {
            const num1Input = document.getElementById('first').value;
            const num2Input = document.getElementById('second').value;
            const display = document.getElementById("display");

            if (num1Input === "" || num2Input === "") {
                display.innerText = "Please enter both numbers";
                return;
            }

            const num1 = Number(num1Input);
            const num2 = Number(num2Input);
            let result = 0;

            if (currentOperator === "+") {
                result = num1 + num2;
            } else if (currentOperator === "-") {
                result = num1 - num2;
            } else if (currentOperator === "*") {
                result = num1 * num2;
            } else if (currentOperator === "/") {
                if (num2 === 0) {
                    display.innerText = "Cannot divide by zero";
                    return;
                }
                result = num1 / num2;
            } else {
                display.innerText = "Please select an operator";
                return;
            }

            display.innerText = "Result is " + result;
        };
    </script>
</body>

</html>
