<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIAL</title>
</head>

<body>

    <h1 id="display">Result will appear here!</h1>
    <input type="number" id="first">
    <p id="operator">____</p>
    <input type="number" id="second">

    <button class="operation" onclick="selectOperator('+')">+</button>
    <button onclick="selectOperator('-')">-</button>
    <button onclick="selectOperator('*')">*</button>
    <button onclick="selectOperator('/')">/</button>
    <button id="equal" onclick="calculate()">=</button>

    <script>

        let num = [1,2,3,4,5,6];
        num.reverse();
        console.log(num);

        let currentOperator = "";

        // Ensure function name matches onclick exactly
        function selectOperator(op) {
            currentOperator = op;
            document.getElementById("operator").innerText = op;
        }

        function calculate() {
            const num1 = Number(document.getElementById('first').value);
            const num2 = Number(document.getElementById('second').value);
            const display = document.getElementById("display");

            if (!document.getElementById('first').value || !document.getElementById('second').value) {
                display.innerText = "Please enter both numbers";
                return;
            }
                if(isNaN(num1) || isNaN(num2)){
                    display.innerText = "Please enter the valid text";
                }
            let result = 0;
            if (currentOperator === "+") {
                result = num1 + num2;
            } else if (currentOperator === "-") {
                result = num1 - num2;
            } else if (currentOperator === "*") {
                result = num1 * num2;
            } else if (currentOperator === "/") {
                if (num2 === 0) {
                    display.innerText = "Cannot divide by zero";
                    return;
                }
                result = num1 / num2;
            } else {
                display.innerText = "Please select an operator";
                return;
            }

            display.innerText = "Result is " + result;
        }
    </script>
</body>

</html>
